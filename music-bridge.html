<!doctype html>
<html>
<head><meta charset="utf-8"><title>music</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}#p{width:200px;height:120px}</style></head>
<body>
<div id="p"></div>
<script>
  var videoId = new URLSearchParams(location.search).get('v') || '';
  var want = { playing: false, volume: 64, muted: false };
  var player = null;
  function apply() {
    if (!player || !player.setVolume) return;
    player.setVolume(want.muted ? 0 : want.volume);
    if (want.playing) player.playVideo(); else player.pauseVideo();
  }
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.source !== 'se-loadscreen') return;
    want = { playing: !!e.data.playing, volume: Number(e.data.volume) || 0, muted: !!e.data.muted };
    apply();
  });
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: videoId, width: 200, height: 120,
      playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, modestbranding: 1, rel: 0, playsinline: 1, loop: 1, playlist: videoId },
      events: {
        onReady: function () { apply(); },
        onStateChange: function (ev) { if (ev.data === 0) { player.seekTo(0); apply(); } }
      }
    });
    parent.postMessage({ source: 'se-bridge', ready: true }, '*');
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(s);
</script>
</body>
</html>
